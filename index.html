<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ujian Hiragana & Katakana</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:900px;
    margin:auto;
    padding:20px;
    background:#f5f5f5;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:10px;
    margin-bottom:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
}

.timer{
    position:fixed;
    top:10px;
    right:10px;
    background:red;
    color:white;
    padding:10px;
    border-radius:8px;
    font-weight:bold;
    z-index:999;
}

button{
    background:#28a745;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}
</style>
</head>

<body>

<div class="timer" id="timer">01:30:00</div>

<h1>UJIAN HIRAGANA & KATAKANA</h1>

<div class="card">

<label>Nama Guru:</label>
<input
type="text"
id="guru"
value="Nama Guru"
style="width:100%;padding:10px;margin-top:5px;"
>

<br><br>

<label>Nama Siswa:</label>
<input
type="text"
id="nama"
placeholder="Masukkan nama siswa"
style="width:100%;padding:10px;margin-top:5px;"
>

</div>

<form id="quizForm">

<div class="card">
<h3>1. あ = ?</h3>
<input type="radio" name="q1" value="0"> i<br>
<input type="radio" name="q1" value="1"> a<br>
<input type="radio" name="q1" value="0"> u<br>
<input type="radio" name="q1" value="0"> e
</div>

<div class="card">
<h3>2. き = ?</h3>
<input type="radio" name="q2" value="1"> ki<br>
<input type="radio" name="q2" value="0"> ka<br>
<input type="radio" name="q2" value="0"> ku<br>
<input type="radio" name="q2" value="0"> ko
</div>

<div class="card">
<h3>3. ね = ?</h3>
<input type="radio" name="q3" value="0"> ni<br>
<input type="radio" name="q3" value="1"> ne<br>
<input type="radio" name="q3" value="0"> no<br>
<input type="radio" name="q3" value="0"> nu
</div>

<div class="card">
<h3>4. さ = ?</h3>
<input type="radio" name="q4" value="0"> shi<br>
<input type="radio" name="q4" value="1"> sa<br>
<input type="radio" name="q4" value="0"> su<br>
<input type="radio" name="q4" value="0"> se
</div>

<div class="card">
<h3>5. ほ = ?</h3>
<input type="radio" name="q5" value="0"> ha<br>
<input type="radio" name="q5" value="0"> hi<br>
<input type="radio" name="q5" value="1"> ho<br>
<input type="radio" name="q5" value="0"> he
</div>

<div class="card">
<h3>6. ア = ?</h3>
<input type="radio" name="q6" value="1"> a<br>
<input type="radio" name="q6" value="0"> i<br>
<input type="radio" name="q6" value="0"> u<br>
<input type="radio" name="q6" value="0"> e
</div>

<div class="card">
<h3>7. ケ = ?</h3>
<input type="radio" name="q7" value="0"> ka<br>
<input type="radio" name="q7" value="1"> ke<br>
<input type="radio" name="q7" value="0"> ko<br>
<input type="radio" name="q7" value="0"> ku
</div>

<div class="card">
<h3>8. モ = ?</h3>
<input type="radio" name="q8" value="0"> ma<br>
<input type="radio" name="q8" value="0"> mi<br>
<input type="radio" name="q8" value="0"> me<br>
<input type="radio" name="q8" value="1"> mo
</div>

<div class="card">
<h3>9. ツ = ?</h3>
<input type="radio" name="q9" value="0"> chi<br>
<input type="radio" name="q9" value="1"> tsu<br>
<input type="radio" name="q9" value="0"> su<br>
<input type="radio" name="q9" value="0"> ta
</div>

<div class="card">
<h3>10. ナ = ?</h3>
<input type="radio" name="q10" value="0"> ta<br>
<input type="radio" name="q10" value="1"> na<br>
<input type="radio" name="q10" value="0"> ni<br>
<input type="radio" name="q10" value="0"> ne
</div>

<button type="button" onclick="selesaiUjian()">
SELESAI UJIAN
</button>

</form>

<br>
<div id="hasil"></div>

<script>

let cheatCount = 0;

/* Timer 150 menit */
let waktu = 5400;

/* Anti pindah tab */
document.addEventListener("visibilitychange", () => {
    if(document.hidden){
        cheatCount++;
        alert("Peringatan! Keluar dari halaman ujian terdeteksi.");
    }
});

/* Anti pindah aplikasi */
window.addEventListener("blur", () => {
    cheatCount++;
});

/* Anti klik kanan */
document.addEventListener("contextmenu", e => {
    e.preventDefault();
});

/* Anti copy */
document.addEventListener("copy", e => {
    e.preventDefault();
});

const timer = setInterval(() => {

    let menit = Math.floor(waktu / 60);
    let detik = waktu % 60;

    document.getElementById("timer").innerHTML =
        String(menit).padStart(2,"0") +
        ":" +
        String(detik).padStart(2,"0");

    waktu--;

    if(waktu < 0){
        clearInterval(timer);
        alert("Waktu habis!");
        selesaiUjian();
    }

},1000);

function konfirmasiSelesai(){

    const yakin = confirm(
        "Apakah Anda yakin ingin mengakhiri ujian sekarang? Jawaban yang sudah dikirim tidak dapat diubah lagi."
    );

    if(yakin){
        selesaiUjian();
    }
}

function selesaiUjian(){

    clearInterval(timer);

    const guru =
    document.getElementById("guru").value.trim();

    const nama =
    document.getElementById("nama").value.trim();

    if(nama === ""){
        alert("Masukkan nama siswa terlebih dahulu");
        return;
    }

    let skor = 0;

    for(let i=1;i<=10;i++){

        const jawaban =
        document.querySelector(
        `input[name=q${i}]:checked`
        );

        if(jawaban){
            skor += Number(jawaban.value);
        }
    }

    let nilai = skor * 10;

    let status =
    nilai >= 70 ? "LULUS" : "TIDAK LULUS";

    document.getElementById("hasil").innerHTML = `
    <div class="card">
    <h2>HASIL UJIAN</h2>
    <p><b>Guru:</b> ${guru}</p>
    <p><b>Nama Siswa:</b> ${nama}</p>
    <p><b>Nilai:</b> ${nilai}</p>
    <p><b>Pelanggaran:</b> ${cheatCount}</p>
    <p><b>Status:</b> ${status}</p>
    </div>
    `;

    kirimWhatsApp(
        guru,
        nama,
        nilai,
        cheatCount,
        status
    );
}

function kirimWhatsApp(
    guru,
    nama,
    nilai,
    pelanggaran,
    status
){

    const nomorGuru = "6285798513212";

    const pesan =
`HASIL UJIAN HIRAGANA & KATAKANA

Guru: ${guru}
Nama Siswa: ${nama}
Nilai: ${nilai}
Pelanggaran: ${pelanggaran}
Status: ${status}`;

    const url =
`https://wa.me/${nomorGuru}?text=${encodeURIComponent(pesan)}`;

    window.open(url,'_blank');
}

</script>

</body>
</html>
